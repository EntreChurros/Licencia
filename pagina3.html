<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando Licencia Digital</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #04062d;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    .pantalla {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 23vh;
      text-align: center;
    }

    /* =========================================
       LOGO
       SOLO CAMBIA "logo.png" POR TU IMAGEN
       ========================================= */

    .logo {
      width: min(66vw, 470px);
      height: auto;
      display: block;
      object-fit: contain;
      margin-bottom: 17vh;
    }

    /* =========================================
       CÍRCULO DE CARGA
       ========================================= */

    .zona-carga {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .cargador {
      width: 96px;
      height: 96px;
      border-radius: 50%;

      background:
        conic-gradient(
          from 0deg,
          #f5bf16 0deg,
          #f5bf16 290deg,
          transparent 290deg,
          transparent 360deg
        );

      -webkit-mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 10px),
          #000 calc(100% - 10px)
        );

      mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 10px),
          #000 calc(100% - 10px)
        );

      animation: girar 0.9s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    .texto-carga {
      font-size: clamp(18px, 2.6vw, 29px);
      color: white;
      font-weight: 400;
    }

    /* =========================================
       MENSAJE INFERIOR
       ========================================= */

    .advertencia {
      position: absolute;
      left: 50%;
      bottom: 10.5vh;
      transform: translateX(-50%);

      width: min(88vw, 620px);

      font-size: clamp(18px, 2.5vw, 29px);
      line-height: 1.08;

      color: white;
      text-align: center;
    }

    /* Ajustes para celulares */

    @media (max-width: 480px) {

      .pantalla {
        padding-top: 22vh;
      }

      .logo {
        width: 66vw;
        margin-bottom: 14vh;
      }

      .cargador {
        width: 82px;
        height: 82px;
      }

      .advertencia {
        bottom: 8.5vh;
      }
    }
  </style>
</head>

<body>

  <div class="pantalla">

    <!-- =====================================
         AQUÍ COLOCAS TU LOGO
         
         Puedes cambiar solamente:
         logo.png
         
         Ejemplo:
         logo.jpg
         logo.jpeg
         logo.webp
         ===================================== -->

    <img
      src="logo.png"
      class="logo"
      alt="Logo"
    >

    <!-- CARGADOR -->

    <div class="zona-carga">

      <div class="cargador"></div>

      <div class="texto-carga">
        Cargando Licencia Digital
      </div>

    </div>

    <!-- MENSAJE -->

    <div class="advertencia">
      No grabes videos mientras manejas tu vehículo.
      Una distracción puede ser fatal.
    </div>

  </div>


  <!-- =====================================
       REDIRECCIÓN DESPUÉS DE 5 SEGUNDOS
       ===================================== -->

  <script>

    setTimeout(function() {

      window.location.href = "menu.html";

    }, 5000);

  </script>

</body>
</html>
